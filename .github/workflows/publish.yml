name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build_windows:
    name: Build release (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release_cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release_cargo-

      - name: Build release
        run: cargo build --release

      - name: Archive EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-release
          path: |
            target/release/osu-directer.exe

  create_release:
    name: Publish release
    needs: [ build_windows ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # We need fetch depth 0 to get all the tags for determining the previous tag in the changelog generation.

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename asset
        run: mv dist/Windows-release/osu-directer.exe dist/osu-directer-win64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/osu-directer-win64.exe
